      properties:
        id:
          type: integer
          readOnly: true
        parent_id:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        is_active:
          type: boolean
        position:
          type: integer
        path:
          type: string
          readOnly: true
        product_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - path
      - product_count
      - updated_at
    CategoryRequest:
      type: object
      properties:
        parent_id:
          type: integer
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        is_active:
          type: boolean
        position:
          type: integer
      required:
      - name
    ChangePasswordRequest:
