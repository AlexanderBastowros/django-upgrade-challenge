          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserActionRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAction'
          description: ''
    delete:
      operationId: actions_destroy
      description: |-
        The current user's action log.

        Server-side writes are recorded automatically; clients may additionally
        record ``viewed``/``searched``/``clicked``/``shared``/``custom`` events.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user action.
        required: true
      tags:
      - activity
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
