components:
  schemas:
    ActionSummaryRow:
      type: object
      properties:
        verb:
          type: string
        count:
          type: integer
      required:
      - count
      - verb
    ActionVerbEnum:
      enum:
      - created
      - updated
      - deleted
      - viewed
      - searched
      - clicked
      - shared
      - followed
      - unfollowed
      - reviewed
      - asked
      - answered
      - status_changed
      - stock_adjusted
      - checked_out
      - paid
      - cancelled
      - refunded
      - closed
      - shipment_pending
      - shipment_in_transit
      - shipment_delivered
      - shipment_returned
      - logged_in
      - custom
      type: string
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/AddressKindEnum'
        label:
          type: string
          maxLength: 40
        full_name:
          type: string
          maxLength: 120
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        region:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          description: ISO 3166-1 alpha-2
          maxLength: 2
        phone:
          type: string
          maxLength: 32
        is_default:
          type: boolean
        one_line:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - country
      - created_at
      - full_name
      - id
      - line1
      - one_line
      - postal_code
      - updated_at
    AddressKindEnum:
      enum:
      - shipping
      - billing
      type: string
    AddressRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AddressKindEnum'
        label:
          type: string
          maxLength: 40
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        region:
          type: string
          maxLength: 100
        postal_code:
          type: string
          minLength: 1
          maxLength: 20
        country:
          type: string
          minLength: 1
          description: ISO 3166-1 alpha-2
          maxLength: 2
        phone:
          type: string
          maxLength: 32
        is_default:
          type: boolean
      required:
      - city
      - country
      - full_name
      - line1
      - postal_code
    AnswerRequest:
      type: object
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - answer
    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 60
        is_active:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        item_count:
          type: integer
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - item_count
      - items
      - subtotal
      - updated_at
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cart:
          type: integer
        product:
          type: integer
        variant:
          type: integer
          nullable: true
        quantity:
          type: integer
          minimum: 1
        product_detail:
          allOf:
          - $ref: '#/components/schemas/ProductList'
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        line_total:
          type: string
          format: decimal
          pattern: ^\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cart
      - created_at
      - id
      - line_total
      - product
      - product_detail
      - unit_price
    CartItemRequest:
      type: object
      properties:
        cart:
          type: integer
        product:
          type: integer
        variant:
          type: integer
          nullable: true
        quantity:
          type: integer
          minimum: 1
      required:
      - cart
      - product
    CartRequest:
