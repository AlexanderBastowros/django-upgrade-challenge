openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.4.0
  description: 'Multi-vendor marketplace backend: users, stores, products, carts,
    orders and activity.'
paths:
  /api/health/:
    get:
      operationId: api_health_retrieve
      summary: Liveness/readiness probe
      tags:
      - meta
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/actions/:
    get:
      operationId: actions_list
      description: |-
        The current user's action log.

        Server-side writes are recorded automatically; clients may additionally
        record ``viewed``/``searched``/``clicked``/``shared``/``custom`` events.
      parameters:
      - in: query
        name: object_id
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: verb
        schema:
          type: string
          enum:
          - answered
          - asked
          - cancelled
          - checked_out
          - clicked
          - closed
          - created
          - custom
          - deleted
          - followed
          - logged_in
          - paid
          - refunded
          - reviewed
          - searched
          - shared
          - shipment_delivered
          - shipment_in_transit
          - shipment_pending
          - shipment_returned
          - status_changed
          - stock_adjusted
          - unfollowed
          - updated
          - viewed
      tags:
      - activity
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserActionList'
          description: ''
    post:
      operationId: actions_create
      description: |-
        The current user's action log.

        Server-side writes are recorded automatically; clients may additionally
        record ``viewed``/``searched``/``clicked``/``shared``/``custom`` events.
      tags:
      - activity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserActionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAction'
          description: ''
  /api/v1/actions/{id}/:
